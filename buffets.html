<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buffets – Edelnord Catering</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buffets.css" />
</head>

<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>

  <section class="buffet-page">
    <div class="buffet-logo">
      <img src="assets/Slogan.PNG" alt="Edelnord Catering">
    </div>

    <div class="buffet-tabs">
      <button class="buffet-tab active" data-buffet="0">Buffet 1</button>
      <button class="buffet-tab" data-buffet="1">Buffet 2</button>
      <button class="buffet-tab" data-buffet="2">Buffet 3</button>
      <button class="buffet-tab" data-buffet="3">Buffet 4</button>
      <button class="buffet-tab" data-buffet="4">Buffet 5</button>
      <button class="buffet-tab" data-buffet="5">Buffet 6</button>
      <button class="buffet-tab" data-buffet="6">Buffet 7</button>
    </div>

       <main class="buffet-stage">
      <aside class="buffet-side">
        <div class="side-album">
          <img id="side-album-image" src="assets/album1.jpg" alt="Edelnord Buffet Foto">
        </div>
      </aside>

      <section class="menu-card">
        <div class="buffet-image-box">
          <img id="buffet-image" src="assets/buffet1.jpg" alt="Buffet 1">
        </div>
      </section>
    </main>

    <p class="buffet-hint">Wählen Sie ein anderes Buffet, um die Auswahl zu sehen.</p>
  </section>

  <script src="js/main.js"></script>
  <script src="js/buffets.js"></script>
</body>
</html>
