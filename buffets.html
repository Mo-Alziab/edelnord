<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buffets – Edelnord Catering</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buffets.css" />
</head>

<body>
  <div class="cursor"></div>
  <div class="cursor-ring"></div>

 <section class="buffet-page">
  <a href="index.html" class="home-btn">Home</a>

  <div class="buffet-container">

    <aside class="buffet-sidebar">
      <div class="buffet-logo">
        <img src="assets/Slogan.PNG" alt="Edelnord Catering">
      </div>

      <div class="buffet-tabs">
        <button class="buffet-tab active" data-buffet="0">Klassisches Buffet</button>
        <button class="buffet-tab" data-buffet="1">Norddeutsches Buffet</button>
        <button class="buffet-tab" data-buffet="2">Mediterranes Buffet</button>
        <button class="buffet-tab" data-buffet="3">Orientalisches Buffet</button>
        <button class="buffet-tab" data-buffet="4">Grillbuffet</button>
        <button class="buffet-tab" data-buffet="5">BBQ Premium Buffet</button>
        <button class="buffet-tab" data-buffet="6">Sommerliches Grillbuffet</button>
        <button class="buffet-tab" data-buffet="7">Genussbuffet</button>
      </div>

      <div class="side-album">
        <img id="side-album-image" src="assets/album1.jpg" alt="Buffet Foto">
      </div>

      <a href="index.html#kontakt" class="buffet-cta">Anfrage stellen</a>
    </aside>

    <main class="menu-area">
      <img id="buffet-image" src="assets/buffet/buffet1.png" alt="Buffet 1">
    </main>

  </div>
</section>
  <script src="js/main.js"></script>
  <script src="js/buffets.js"></script>
</body>
</html>
