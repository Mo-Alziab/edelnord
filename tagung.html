<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Tagungen mit EdelNord Catering und unserem Partner Hotel & Eventlocation Adler."
  >

  <title>Tagung | EdelNord Catering</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/tagung.css">
</head>

<body>

  <div class="cursor"></div>
  <div class="cursor-ring"></div>

  <section class="tagung-page">

    <a
      href="index.html"
      class="home-btn"
      aria-label="Zurück zur Startseite"
    >
      Home
    </a>

    <main class="tagung-content">

      <div class="tagung-image">

        <picture>

          <!-- Eigenes langes Bild für Handy -->
          <source
            media="(max-width: 900px)"
            srcset="assets/tagung/tagung-mobile.PNG"
          >

          <!-- Normales Bild für Desktop -->
          <img
            src="assets/tagung/tagung.PNG"
            alt="Tagungsangebot von EdelNord Catering"
            draggable="false"
          >

        </picture>

      </div>

      <a
        href="https://www.adler-iz.de"
        target="_blank"
        rel="noopener noreferrer"
        class="partner-btn"
      >
        Anfragen
      </a>

    </main>

  </section>

  <script src="js/main.js"></script>

</body>
</html>
